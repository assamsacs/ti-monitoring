<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TI Planning &amp; Monitoring</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#f4f6f8;--card:#ffffff;--ink:#17212b;--muted:#5d6b79;--line:#e2e7ec;--soft:#f8fafb;
  --accent:#0f6e56;--accent-ink:#ffffff;--accent-soft:#e3f4ee;
  --red:#b42318;--red-soft:#fdeceb;--amber:#a15c07;--amber-soft:#fdf2df;--green:#1e7b34;--green-soft:#e6f4ea;
  --na:#8a96a3;--na-soft:#eef1f4;--radius:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11161b;--card:#192128;--ink:#e6ebf0;--muted:#9aa7b4;--line:#2a343e;--soft:#1e2730;
    --accent:#3fb68f;--accent-ink:#0b1a14;--accent-soft:#183a30;
    --red:#f0857a;--red-soft:#3a1d1b;--amber:#f0b45a;--amber-soft:#3a2c14;--green:#6cc983;--green-soft:#183020;
    --na:#7d8995;--na-soft:#252f38;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
h1{font-size:18px;margin:0;font-weight:600}
h2{font-size:16px;margin:0 0 12px;font-weight:600}
h3{font-size:14px;margin:0 0 8px;font-weight:600}
.muted{color:var(--muted)}
.small{font-size:12px}
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.bar{display:flex;align-items:center;gap:12px;padding:12px 20px;flex-wrap:wrap}
.bar .grow{flex:1}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:500;background:var(--accent-soft);color:var(--accent)}
.tabs{display:flex;gap:4px;padding:0 16px;overflow-x:auto}
.tab{border:0;background:none;padding:10px 12px;border-bottom:2px solid transparent;cursor:pointer;color:var(--muted);white-space:nowrap}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:500}
main{padding:20px;max-width:1280px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.two{grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}
.kpi .v{font-size:26px;font-weight:600;margin-top:2px}
.kpi .l{color:var(--muted);font-size:12px}
.kpi .s{color:var(--muted);font-size:12px}
.btn{border:1px solid var(--line);background:var(--card);padding:7px 12px;border-radius:8px;cursor:pointer;display:inline-block;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;text-decoration:underline}
input[type=text],input[type=password],input[type=number],input[type=email],input[type=month],input[type=date],select,textarea{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 10px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:500;background:var(--soft)}
td.num,th.num{text-align:right}
.chip{display:inline-block;min-width:44px;text-align:center;padding:2px 6px;border-radius:6px;font-size:12px;font-weight:500}
.r{background:var(--red-soft);color:var(--red)}.a{background:var(--amber-soft);color:var(--amber)}.g{background:var(--green-soft);color:var(--green)}.na{background:var(--na-soft);color:var(--na)}
.pbar{height:8px;background:var(--na-soft);border-radius:4px;overflow:hidden;min-width:90px;position:relative}
.pbar>span{display:block;height:100%}
.pbar .r{background:var(--red)}.pbar .a{background:var(--amber)}.pbar .g{background:var(--green)}
.pbar i{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.6}
.status-ok{color:var(--green)}.status-miss{color:var(--red)}.status-warn{color:var(--amber)}
.login{max-width:420px;margin:8vh auto}
.notice{padding:10px 12px;border-radius:8px;background:var(--amber-soft);color:var(--amber);font-size:13px;margin-bottom:12px}
.ok-box{padding:10px 12px;border-radius:8px;background:var(--green-soft);color:var(--green);font-size:13px;margin-bottom:12px}
.err-box{padding:10px 12px;border-radius:8px;background:var(--red-soft);color:var(--red);font-size:13px;margin-bottom:12px}
.chart-box{position:relative;height:300px}
.email-edit{border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--soft);max-height:520px;overflow:auto;outline:none}
.email-edit:focus{border-color:var(--accent)}
.email-edit table td,.email-edit table th{white-space:normal}
.toast{position:fixed;bottom:20px;right:20px;background:var(--ink);color:var(--card);padding:10px 14px;border-radius:8px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
tr.bad td{background:var(--red-soft)}
tr.warn td{background:var(--amber-soft)}
.legend span{margin-right:6px}
.dform{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.dform label.f input{font-size:16px}
.ctx{font-size:11px;color:var(--muted)}
.grid-dots td{padding:3px;text-align:center;min-width:22px}
.dot{display:inline-block;width:16px;height:16px;border-radius:4px}
.dot.ok{background:var(--green)}.dot.miss{background:var(--red)}.dot.fut{background:var(--na-soft)}.dot.hol{background:transparent;border:1px dashed var(--na)}
.act-row{display:grid;grid-template-columns:1.3fr 1.3fr .6fr 1.6fr auto;gap:8px;margin-bottom:8px}
@media (max-width:640px){main{padding:12px}.bar{padding:10px 12px}.two{grid-template-columns:1fr}.act-row{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="app"></div>
<script>
window.addEventListener('error',function(e){
  var app=document.getElementById('app'); if(!app||app.innerHTML.trim()) return;
  app.innerHTML='<div style="max-width:640px;margin:8vh auto;padding:16px;border:1px solid #e2e7ec;border-radius:10px;font:14px Arial,sans-serif">'+
   '<h2 style="margin-top:0;color:#b42318">The app could not start</h2>'+
   '<p>This usually means the CONFIG lines near the top of index.html were changed by mistake (a missing quote, comma, or curly quotes from Word).</p>'+
   '<p>The line must look exactly like:<br><code>API_URL: \'https://script.google.com/macros/s/....../exec\',</code></p>'+
   '<p style="color:#5d6b79;font-size:12px">Technical detail: '+String(e.message).replace(/</g,'&lt;')+(e.lineno?' (line '+e.lineno+')':'')+'</p></div>';
});
</script>

const $ = s => document.querySelector(s);

const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const pad = n => String(n).padStart(2,'0');
const iso = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today = () => iso(new Date());
const monthOf = d => d.slice(0,7);
const fmtMonth = m => { if(!m) return ''; const [y,mm]=m.split('-'); return MON[+mm-1]+' '+y; };
const fmtDate = d => { if(!d) return '–'; const [y,m,dd]=d.split('-'); return (+dd)+' '+MON[+m-1]; };
const nf = n => n==null||n===''?'–':Number(n).toLocaleString('en-IN');
const nf1 = n => n==null?'–':(n>=10?Math.round(n).toLocaleString('en-IN'):(Math.round(n*10)/10).toString());

function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2800);}
function addMonths(m,n){const [y,mm]=m.split('-').map(Number);const d=new Date(y,mm-1+n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1);}
function addDays(d,n){const [y,m,dd]=d.split('-').map(Number);return iso(new Date(y,m-1,dd+n));}
function fyMonths(m){const [y,mm]=m.split('-').map(Number);const fy=mm>=CONFIG.FY_START_MONTH?y:y-1;let cur=fy+'-'+pad(CONFIG.FY_START_MONTH);const out=[];while(cur<=m){out.push(cur);cur=addMonths(cur,1);}return out;}
function normMonth(v, fallback){
  if(v===''||v==null) return fallback||null;
  if(typeof v==='number'){ const d=XLSX.SSF.parse_date_code(v); if(d) return d.y+'-'+pad(d.m); }
  if(v instanceof Date) return v.getFullYear()+'-'+pad(v.getMonth()+1);
  const s=String(v).trim();
  let m=s.match(/^(\d{4})[-\/.](\d{1,2})/); if(m) return m[1]+'-'+m[2].padStart(2,'0');
  m=s.match(/^(\d{1,2})[-\/.](\d{4})$/); if(m) return m[2]+'-'+m[1].padStart(2,'0');
  m=s.match(/^([A-Za-z]{3,9})[\s\-\/,']*(\d{2,4})$/);
  if(m){const i=MON.findIndex(x=>x.toLowerCase()===m[1].slice(0,3).toLowerCase()); if(i>=0){let y=m[2].length===2?'20'+m[2]:m[2]; return y+'-'+pad(i+1);}}
  return null;
}
const TYP_ALIASES = {fsw:'FSW',msm:'MSM',idu:'IDU',pwid:'IDU',fidu:'IDU',tg:'TG',tgh:'TG',htg:'TG',hijra:'TG',hijratg:'TG',transgender:'TG',migrant:'Migrant',migrants:'Migrant',trucker:'Truckers',truckers:'Truckers',transportworker:'Truckers',transportworkers:'Truckers'};
function typList(ti){
  if(!ti) return []; if(ti._typ) return ti._typ;
  const parts=String(ti.typology||'').split(/[,;+&\/]|\band\b/i).map(x=>x.trim()).filter(Boolean);
  const out=[]; parts.forEach(x=>{ const k=TYP_ALIASES[x.toLowerCase().replace(/[^a-z]/g,'')]; const v=k||x; if(!out.includes(v)) out.push(v); });
  ti._typ=out; return out;
}
const typLabel = ti => { const l=typList(ti); return l.length>1 ? 'Core composite ('+l.join(', ')+')' : (l[0]||'–'); };
const applicable = (ti,ind) => !ind.only || ind.only.some(t=>typList(ti).includes(t));

function ragOf(p){ if(p==null) return 'na'; if(p>=S.thresholds.green) return 'g'; if(p>=S.thresholds.amber) return 'a'; return 'r'; }

function cssVar(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}

function workingDays(m, hol){
  hol = new Set(hol||holidays()); const [y,mm]=m.split('-').map(Number); const n=new Date(y,mm,0).getDate(); const out=[];
  for(let d=1;d<=n;d++){ const dt=new Date(y,mm-1,d); if(dt.getDay()!==0){ const s=iso(dt); if(!hol.has(s)) out.push(s);} }

}
function monthState(m){ const tm=monthOf(today()); return m<tm?'past':(m>tm?'future':'open'); }

function dayEntries(code,m){ return S.dIdx[key(code,m)]||[]; }
function entryTotals(e){ const v={}; DAILY_KEYS.forEach(k=>v[k]=e.values&&e.values[k]!=null?+e.values[k]:0); v.camps=0; v.events=0;
  (e.activities||[]).forEach(a=>{ if(CAMP_TYPES.includes(a.type)) v.camps++; if(EVENT_TYPES.includes(a.type)) v.events++; }); return v; }
function dailyAgg(code,m){
  const list=dayEntries(code,m); if(!list.length) return null;
  const v={}; INDICATORS.forEach(i=>v[i.key]=0);
  list.forEach(e=>{const t=entryTotals(e); INDICATORS.forEach(i=>v[i.key]+=t[i.key]);});
  return {values:v, days:list.length, last:list[list.length-1].date};
}
function achFor(code,m){
  const c=S.db.ach[key(code,m)]; if(c) return {values:c.values, closed:true, remarks:c.remarks, at:c.uploadedAt};
  const a=dailyAgg(code,m); return a?{values:a.values, closed:false, days:a.days, last:a.last}:null;
}
function paceInfo(code,m){
  const wd=workingDays(m), t=today();
  const past=wd.filter(d=>d<t).length, hasToday=wd.includes(t)&&dayEntries(code,m).some(e=>e.date===t);
  const elapsed=past+(hasToday?1:0);
  return {wd:wd.length, elapsed, remaining:wd.length-elapsed, asOf:hasToday?t:addDays(t,-1)};
}
function lastEntry(code){ let last=null; Object.values(S.db.daily).forEach(e=>{if(e.ti===code&&(!last||e.date>last))last=e.date;}); return last; }
function silentDays(code){
  const t=today(), last=lastEntry(code)||'0000-00-00', m=monthOf(t);
  return [...workingDays(addMonths(m,-1)),...workingDays(m)].filter(d=>d>last&&d<t).length;
}

/* ============================ SCORING ============================ */
function score(ti, months){
  months=[].concat(months); const open1=months.length===1&&monthState(months[0])==='open';
  const per={}; let sum=0,cnt=0,psum=0,pcnt=0;
  const hasPlan=months.some(m=>S.db.plans[key(ti.code,m)]);
  const achs=months.map(m=>achFor(ti.code,m)); const hasAch=achs.some(Boolean);
  const paces=months.map(m=>monthState(m)==='open'?paceInfo(ti.code,m):null);
  INDICATORS.forEach(ind=>{
    if(!applicable(ti,ind)){per[ind.key]={na:true};return;}
    let t=0,a=0,tAny=false,exp=0;
    months.forEach((m,i)=>{
      const p=S.db.plans[key(ti.code,m)], r=achs[i], pc=paces[i];
      const tv=p&&p.values[ind.key]!=null&&p.values[ind.key]!==''?+p.values[ind.key]:null;
      if(tv!=null){ t+=tv; tAny=true; exp+= pc ? tv*pc.elapsed/Math.max(1,pc.wd) : tv; }
      if(r&&r.values[ind.key]!=null) a+=+r.values[ind.key];
    });
    const x={t:tAny?t:null, a:hasAch?a:null, exp:tAny?exp:null};
    x.p = tAny&&t>0&&hasAch ? a/t*100 : null;
    x.pace = tAny&&exp>0&&hasAch ? a/exp*100 : null;
    if(open1){ const pc=paces[0]; x.need = pc.remaining>0&&x.t!=null ? Math.max(0,(x.t-a)/pc.remaining) : null; x.rate = pc.elapsed&&hasAch ? a/pc.elapsed : null;
      if(x.t!=null&&x.t<pc.wd){ x.low=true; if(pc.elapsed/pc.wd<LOW_JUDGE_FROM) x.pace=null; } }
    per[ind.key]=x;
    if(x.p!=null){sum+=Math.min(x.p,100);cnt++;}
    if(x.pace!=null){psum+=Math.min(x.pace,100);pcnt++;}
  });
  const open=paces.some(Boolean);
  return {per, overall:cnt?sum/cnt:null, overallPace:pcnt?psum/pcnt:null, hasPlan, hasAch, open,
    closed:achs.length&&achs.every(a=>a&&a.closed), pace:paces[paces.length-1], ach:achs[achs.length-1]};
}
const headline = s => s.open ? s.overallPace : s.overall;
const LOW_JUDGE_FROM = 0.75;  // low-volume indicators (plan < 1 per working day) are judged only in the last quarter of the month
const isPending = x => x && x.low && x.pace==null;
const pendChip = x => `<span class="chip na" title="Low-volume indicator – judged against the full plan in the last week of the month">${nf(x.a||0)}/${nf(x.t)}</span>`;
const metric = (s,k) => s.per[k].na ? null : (s.open ? s.per[k].pace : s.per[k].p);
function allMonths(){ const s=new Set([monthOf(today())]); Object.values(S.db.plans).forEach(r=>s.add(r.month)); Object.values(S.db.ach).forEach(r=>s.add(r.month)); Object.keys(S.dIdx).forEach(k=>s.add(k.split('|')[1])); return [...s].sort(); }
function visibleTIs(){ let l=S.db.tis; if(S.session.role==='TI') l=l.filter(t=>t.code===S.session.code); if(S.district!=='All') l=l.filter(t=>t.district===S.district); return l; }

/* ============================ DEMO DATA ============================ */
function seedDemo(){
  let seed=7; const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646;};
  const tis=[
    ['TI001','FSW TI – Kamrup Metro','Kamrup Metro','FSW',1500,1.02],
    ['TI002','MSM-TG TI – Kamrup Metro','Kamrup Metro','MSM, TG',900,0.93],
    ['TI003','IDU TI – Cachar','Cachar','IDU',800,0.66],
    ['TI004','Core Composite TI – Jorhat','Jorhat','FSW, MSM, IDU',1100,0.88],
    ['TI005','Migrant TI – Nagaon','Nagaon','Migrant',5000,0.79],
    ['TI006','Truckers TI – Kamrup','Kamrup','Truckers',4000,0.84],
    ['TI007','TG TI – Dibrugarh','Dibrugarh','TG',300,0.95],
    ['TI008','FSW TI – Dibrugarh','Dibrugarh','FSW',1000,0.74]
  ].map(([code,name,district,typology,size,perf])=>({code,name,district,typology,size,perf,email:code.toLowerCase()+'@example.org',pm:'Project Manager'}));
  const condomRate={FSW:30,MSM:20,IDU:8,TG:20,'Core Composite':20,Migrant:2,Truckers:3};
  const tm=monthOf(today()), months=[]; for(let i=-6;i<=0;i++) months.push(addMonths(tm,i));
  const plans={},ach={},daily={},now=new Date().toISOString(), t=today();
  const planFor=ti=>{ const s=ti.size, tl=typList(ti), big=tl.some(x=>['Migrant','Truckers'].includes(x)), idu=tl.includes('IDU')?(tl.length>1?0.25:1):0, cr=tl.reduce((a,x)=>a+(condomRate[x]||20),0)/tl.length; return {
      reg:Math.round(s*(big?0.03:0.015)), contact:Math.round(s*(big?0.5:0.85)), condom:Math.round(s*cr),
      nsep:idu?Math.round(s*idu*40):null, rmc:Math.round(s*(big?0.12:0.33)), sti:Math.round(s*(big?0.01:0.03)),
      hivtest:Math.round(s*(big?0.06:1/6)), syph:Math.round(s*(big?0.05:1/6)), linked:Math.max(1,Math.round(s/600)),
      vl:Math.max(1,Math.round(s/400)), camps:big?4:2, events:big?2:4 }; };
  const frac=x=>{const f=Math.floor(x);return f+(rnd()<x-f?1:0);};
  tis.forEach(ti=>{
    const v=planFor(ti);
    months.forEach((m,i)=>{
      plans[key(ti.code,m)]={ti:ti.code,month:m,values:{...v},remarks:'',uploadedAt:now,by:ti.code};
      const closed = i<months.length-1 && !(ti.code==='TI006'&&i===months.length-2);
      const drift = ti.code==='TI003'?(1-i*0.04):1;
      if(closed){
        const a={}; Object.keys(v).forEach(k=>{ if(v[k]==null){a[k]=null;return;} a[k]=Math.max(0,Math.round(v[k]*ti.perf*drift*(0.8+rnd()*0.35))); });
        ach[key(ti.code,m)]={ti:ti.code,month:m,values:a,remarks:'',uploadedAt:now,by:ti.code};
      } else {
        const wd=workingDays(m,[]);
        const stopAt = ti.code==='TI003'?4:(ti.code==='TI007'?2:0);
        const days = wd.filter(d=>d<t);
        const keep = days.slice(0, Math.max(0,days.length-stopAt));
        const campDays=new Set(), eventDays=new Set();
        for(let c=0;c<v.camps;c++) campDays.add(Math.floor((c+0.5)*wd.length/v.camps));
        for(let c=0;c<v.events;c++) eventDays.add(Math.floor((c+0.3)*wd.length/v.events));
        keep.forEach(d=>{
          if(ti.code==='TI008'&&rnd()<0.2) return;
          const idx=wd.indexOf(d), vals={};
          DAILY_KEYS.forEach(k=>{ if(v[k]==null){vals[k]=null;return;} let f=ti.perf*drift*(0.7+rnd()*0.6); if(ti.code==='TI005'&&k==='hivtest') f*=0.55; vals[k]=frac(v[k]/wd.length*f); });
          const acts=[];
          if(campDays.has(idx)&&rnd()<ti.perf) acts.push({type:'Health camp / CBS',venue:'Hotspot '+(idx%7+1),reached:20+Math.round(rnd()*30),remarks:''});
          if(eventDays.has(idx)) acts.push({type:'Community event / meeting',venue:'DIC',reached:15+Math.round(rnd()*20),remarks:''});
          daily[key(ti.code,d)]={ti:ti.code,date:d,values:vals,activities:acts,note:'',at:now,by:ti.code};
        });
      }
    });
    if(['TI001','TI004'].includes(ti.code)) plans[key(ti.code,addMonths(tm,1))]={ti:ti.code,month:addMonths(tm,1),values:{...v},remarks:'',uploadedAt:now,by:ti.code};
    delete ti.perf; delete ti.size; delete ti._typ;
  });
  return {tis,plans,ach,daily,uploads:[],emailLog:[],settings:{sacsPin:'1234',tiPin:'1111',cc:'',sender:'TI Division, SACS',holidays:'',editDays:3,unlocks:{}}, seededFor:tm};
}

/* ============================ API ============================ */
const QKEY='tipm_queue';
function queueGet(){ try{return JSON.parse(localStorage.getItem(QKEY)||'[]');}catch(e){return [];} }
function queueSet(q){ try{localStorage.setItem(QKEY,JSON.stringify(q));}catch(e){} }
async function api(action, payload={}){
  if(!CONFIG.API_URL) return demoApi(action, payload);
  const body = JSON.stringify({action, auth:S.session?{role:S.session.role,code:S.session.code,pin:S.session.pin}:payload.auth, ...payload});
  if(!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(CONFIG.API_URL)) throw new Error('API_URL in index.html does not look right. It must start with https://script.google.com/macros/s/ and end with /exec');
  let res;
  try{ res = await fetch(CONFIG.API_URL,{method:'POST',body,headers:{'Content-Type':'text/plain;charset=utf-8'}}); }
  catch(e){ const err=new TypeError('Could not reach the backend. Check the internet connection, and that the web app is deployed with "Who has access: Anyone".'); throw err; }
  const txt = await res.text(); let j;
  try{ j = JSON.parse(txt); }
  catch(e){ throw new Error(/<html|<!doctype/i.test(txt) ? 'The backend returned a Google page instead of data. In Apps Script: Deploy → Manage deployments → Edit → set "Execute as: Me" and "Who has access: Anyone", then click Deploy.' : 'Unexpected reply from the backend.'); }
  if(!j.ok) throw new Error(j.error||'Request failed'); return j;
}
async function flushQueue(){
  const q=queueGet(); if(!q.length||!S.session) return;
  const left=[];
  for(const e of q){ try{ const r=await api('saveDaily',{entry:e}); applyData(r.data); }catch(err){ if(err instanceof TypeError) left.push(e); else toast('Could not sync '+e.date+': '+err.message); } }
  queueSet(left); if(q.length!==left.length){ toast((q.length-left.length)+' saved entr'+(q.length-left.length===1?'y':'ies')+' synced'); render(); }
}
window.addEventListener('online',flushQueue);
function canEditDate(d){
  const st=S.db.settings||{}, t=today(); if(d>t) return false;
  if(S.session.role==='SACS') return true;
  if(st.unlockUntil&&st.unlockUntil>=t&&d>=addMonths(monthOf(t),-1)+'-01') return true;
  return d>=addDays(t,-(+st.editDays||3));
}
function demoApi(action, p){
  const d = demoLoad();
  const filter = (role,code)=> role==='SACS'?{...d,settings:{...d.settings}}:{...d,tis:d.tis.filter(t=>t.code===code),
      plans:Object.fromEntries(Object.entries(d.plans).filter(([k])=>k.startsWith(code+'|'))),
      ach:Object.fromEntries(Object.entries(d.ach).filter(([k])=>k.startsWith(code+'|'))),
      daily:Object.fromEntries(Object.entries(d.daily).filter(([k])=>k.startsWith(code+'|'))),
      emailLog:[], uploads:d.uploads.filter(u=>u.by===code),
      settings:{holidays:d.settings.holidays,editDays:d.settings.editDays,unlockUntil:(d.settings.unlocks||{})[code]||''}};
  if(action==='login'){
    const {role,code,pin}=p.auth;
    if(role==='SACS'&&pin!==d.settings.sacsPin) throw new Error('Wrong SACS PIN');
    if(role==='TI'){ if(!d.tis.find(t=>t.code===code)) throw new Error('Unknown TI code'); if(pin!==d.settings.tiPin) throw new Error('Wrong TI PIN'); }
    return {ok:true,data:filter(role,code)};
  }
  if(action==='getData') return {ok:true,data:filter(S.session.role,S.session.code)};
  if(action==='saveDaily'){
    const e=p.entry; if(S.session.role==='TI'&&e.ti!==S.session.code) throw new Error('Not your TI');
    if(!canEditDate(e.date)) throw new Error('This date is outside the edit window. Ask SACS to unlock.');
    d.daily[key(e.ti,e.date)]={...e,at:new Date().toISOString(),by:S.session.code||'SACS'}; demoSave(d); return {ok:true,data:filter(S.session.role,S.session.code)};
  }
  if(action==='upload'){
    const store = p.type==='plan'?d.plans:d.ach; const now=new Date().toISOString();
    p.rows.forEach(r=>{ if(S.session.role==='TI'&&r.ti!==S.session.code) return; store[key(r.ti,r.month)]={...r,uploadedAt:now,by:S.session.code||'SACS'}; });
    d.uploads.unshift({type:p.type,rows:p.rows.length,months:[...new Set(p.rows.map(r=>r.month))].join(', '),tis:[...new Set(p.rows.map(r=>r.ti))].join(', '),at:now,by:S.session.role==='SACS'?'SACS':S.session.code,source:p.source||'file'});
    demoSave(d); return {ok:true,saved:p.rows.length,data:filter(S.session.role,S.session.code)};
  }
  if(action==='sendEmails'){
    const now=new Date().toISOString();
    p.emails.forEach(e=>d.emailLog.unshift({at:now,ti:e.ti,to:e.to,cc:e.cc,subject:e.subject,status:'Demo – not sent'}));
    demoSave(d); return {ok:true,sent:p.emails.length,data:filter('SACS')};
  }
  if(action==='saveSettings'){ Object.assign(d.settings,p.settings); demoSave(d); return {ok:true,data:filter('SACS')}; }
  throw new Error('Unknown action');
}
function applyData(data){
  S.db={daily:{},...data}; S.db.settings=S.db.settings||{};
  const st=S.db.settings; if(st.red) S.thresholds={green:+st.amberMax||90,amber:+st.red||70};
  buildIndex();
}

  const red=valid.filter(x=>ragOf(headline(x.s))==='r').length;

  main.innerHTML=`
  ${open?`<div class="ok-box">Live view for ${fmtMonth(m)}: ${pc.elapsed} of ${pc.wd} working days gone. Progress is compared with what should have been done <b>by today</b> (plan × working days gone ÷ working days in month).</div>`:''}

function drawBurn(ti,m,k){
  const wd=workingDays(m), t=today(), plan=S.db.plans[key(ti.code,m)], tv=plan?+plan.values[k]||0:0;
  const byDate={}; dayEntries(ti.code,m).forEach(e=>byDate[e.date]=entryTotals(e)[k]);
  let cum=0; const actual=new Array(wd.length).fill(null);
  const dates=Object.keys(byDate).sort(); let di=0;
  wd.forEach((d,i)=>{ while(di<dates.length&&dates[di]<=d){cum+=byDate[dates[di]];di++;} actual[i]= d<=t ? cum : null; });
  const ideal=wd.map((d,i)=>Math.round(tv*(i+1)/wd.length));
  S.charts.burn=new Chart($('#ch-burn'),{type:'line',data:{labels:wd.map(d=>+d.slice(8)),datasets:[
    {label:'Plan path',data:ideal,borderColor:cssVar('--na'),borderDash:[5,4],pointRadius:0,fill:false},
    {label:'Actual (cumulative)',data:actual,borderColor:cssVar('--accent'),backgroundColor:cssVar('--accent'),pointRadius:2,tension:.15,spanGaps:false}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:true,labels:{color:cssVar('--muted')}}},
      scales:{y:{beginAtZero:true,ticks:{color:cssVar('--muted')},grid:{color:cssVar('--line')}},x:{title:{display:true,text:'Working day (date)',color:cssVar('--muted')},ticks:{color:cssVar('--muted')},grid:{display:false}}}}});
}

      if(!Number.isInteger(n)||n<0){bad=true;el.style.borderColor='var(--red)';} else el.style.borderColor='';
      values[i.key]=n; const tv=plan&&+plan.values[i.key]; if(tv&&n>tv*0.5&&n>5) big.push(i.short);
    });
    if(bad){toast('Whole numbers only');return;}
    const activities=[...main.querySelectorAll('.act-row')].map(r=>({type:r.querySelector('[data-a=type]').value,venue:r.querySelector('[data-a=venue]').value.trim(),reached:+r.querySelector('[data-a=reached]').value||0,remarks:r.querySelector('[data-a=remarks]').value.trim()})).filter(a=>a.type);
    if(big.length&&!confirm(`${big.join(', ')}: one day's number is more than half the monthly plan. Save anyway?`)) return;
    const entry={ti:ti.code,date:d,values,activities,note:$('#d-note').value.trim()};
    const btn=$('#d-save'); btn.disabled=true; btn.textContent='Saving…';
    try{ const r=await api('saveDaily',{entry}); applyData(r.data); toast('Saved'); render(); }
    catch(e){
      if(e instanceof TypeError){ const q=queueGet().filter(x=>!(x.ti===entry.ti&&x.date===entry.date)); q.push(entry); queueSet(q); toast('No network – saved on this phone, will sync automatically'); render(); }
      else { toast(e.message); btn.disabled=false; btn.textContent='Save'; }
    }
  };
}

/* ============================ TI: CLOSE MONTH ============================ */
function renderClose(main){
  const ti=tiByCode(S.session.code), t=today(), tm=monthOf(t);

  if(!cands.length){ main.innerHTML=`<div class="card"><h2>Close month</h2><p class="muted">A month can be closed from its last working day (${fmtDate(lastWd)} for ${fmtMonth(tm)}). Nothing to close yet.</p></div>`; return; }

    <label class="f">Month<select id="c-m">${cands.map(x=>`<option value="${x}" ${x===m?'selected':''}>${fmtMonth(x)}${S.db.ach[key(ti.code,x)]?' (closed)':''}</option>`).join('')}</select></label></div>

  </div>
  <div class="card"><div class="tbl-wrap"><table>
    <thead><tr><th>Indicator</th><th class="num">Plan</th><th class="num">Daily total</th><th class="num">Final figure</th><th class="num">%</th><th>Reason for shortfall</th><th>Corrective action next month</th></tr></thead>
    <tbody>${inds.map(i=>{const tv=plan.values[i.key], dt=agg?agg.values[i.key]:null;
      const fv= closed&&closed.values[i.key]!=null ? closed.values[i.key] : (i.key==='contact'?'':(dt!=null?dt:''));
      const pr=prevRem[i.short]||{};
      return `<tr data-row="${i.key}"><td>${esc(i.label)}${i.key==='contact'?'<div class="ctx">Unique HRGs contacted in the month, from the register</div>':''}</td><td class="num">${nf(tv)}</td><td class="num">${nf(dt)}</td>

        <td class="num" data-pct="${i.key}"></td>

        <td><input type="text" style="width:240px" data-c="${i.key}" value="${esc(pr.a||'')}"></td></tr>`;}).join('')}</tbody></table></div>
    <label class="f" style="margin-top:12px">Overall remarks for SACS (optional)<textarea id="c-rem" rows="2"></textarea></label>

  $('#c-m').onchange=e=>{S.month=e.target.value;render();};
  const upd=()=>inds.forEach(i=>{ const v=main.querySelector(`[data-f="${i.key}"]`).value; const tv=+plan.values[i.key]; const cell=main.querySelector(`[data-pct="${i.key}"]`);

function downloadTemplate(type, month){
  if(!month){toast('Pick a month first');return;}
  const tis = S.session.role==='TI'?[tiByCode(S.session.code)]:S.db.tis;
  const head=[...BASE_COLS.map(c=>c[1]),...INDICATORS.map(i=>i.label),'Remarks'];
  const rows=tis.map(t=>[month,t.code,t.name,...INDICATORS.map(i=>applicable(t,i)?'':'NA'),'']);
  const ws=XLSX.utils.aoa_to_sheet([head,...rows]);
  ws['!cols']=head.map((h,i)=>({wch:i<3?(i===2?30:14):Math.max(12,Math.min(28,h.length+2))}));
  const info=XLSX.utils.aoa_to_sheet([[type==='plan'?'TI MONTHLY PLAN – QUICK TEMPLATE':'TI MONTHLY ACHIEVEMENT – QUICK TEMPLATE'],[],
    ['Month','YYYY-MM, e.g. '+month],['TI Code','Do not change.'],['Indicators','Whole numbers; NA where not applicable.'],['Remarks','Optional.']]);
  info['!cols']=[{wch:20},{wch:80}];
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Data'); XLSX.utils.book_append_sheet(wb,info,'Instructions');
  XLSX.writeFile(wb,`TI_${type==='plan'?'Plan':'Achievement'}_${month}${S.session.role==='TI'?'_'+S.session.code:''}.xlsx`);

const norm = s => String(s).toLowerCase().replace(/\(.*?\)/g,'').replace(/[^a-z0-9]/g,'');
function parseUpload(type, file, defMonth){
  const rd=new FileReader();
  rd.onload=e=>{
    try{
      const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array',cellDates:true});
      if(type==='ach'&&!wb.Sheets['Data_Achievement']&&wb.Sheets['Data']&&wb.Sheets['Monthly_Plan']) throw new Error('This workbook has no achievement sheet. Use the latest "TI Monthly Plan & Report" workbook.');
      const ws=(type==='ach'?wb.Sheets['Data_Achievement']:null)||wb.Sheets['Data']||wb.Sheets[wb.SheetNames[0]];
      const raw=XLSX.utils.sheet_to_json(ws,{defval:'',raw:true});
      if(!raw.length) throw new Error('No data rows found in the file.');
      const headers=Object.keys(raw[0]); const map={};
      headers.forEach(h=>{const n=norm(h);
        if(['month','monthyyyymm','reportingmonth'].includes(n)) map.month=h;
        else if(['ticode','code','ti'].includes(n)) map.ti=h;
        else if(n==='remarks'||n==='remark') map.remarks=h;
        else { const ind=INDICATORS.find(i=>norm(i.label)===n||i.key===n||norm(i.short)===n); if(ind) map[ind.key]=h; }
      });
      if(!map.ti) throw new Error('Column "TI Code" not found. Please use the downloaded template or workbook.');
      const missingInd=INDICATORS.filter(i=>!map[i.key]).map(i=>i.label);
      const rows=raw.filter(r=>String(r[map.ti]).trim()!=='').map(r=>{
        const out={ti:String(r[map.ti]).trim().toUpperCase(),month:normMonth(map.month?r[map.month]:'',defMonth),values:{},remarks:map.remarks?String(r[map.remarks]).trim():'',errors:[],warnings:[]};
        const ti=tiByCode(out.ti);
        if(!ti) out.errors.push('Unknown TI code');
        else if(S.session.role==='TI'&&out.ti!==S.session.code) out.errors.push('You can only upload for '+S.session.code);
        if(!out.month) out.errors.push('Month not readable');
        INDICATORS.forEach(i=>{
          const v=map[i.key]?r[map[i.key]]:''; const sv=String(v).trim();
          if(sv===''||/^n\/?a$/i.test(sv)){ out.values[i.key]=null; if(ti&&applicable(ti,i)&&sv==='') out.warnings.push(i.short+' blank'); return; }
          const n=Number(sv.replace(/,/g,''));
          if(!isFinite(n)||n<0){out.errors.push(i.short+' not a valid number');return;}
          if(ti&&!applicable(ti,i)&&n>0) out.warnings.push(i.short+' not applicable to '+typList(ti).join(', ')+' – ignored');
          out.values[i.key]=ti&&!applicable(ti,i)?null:Math.round(n);
        });
        const pl=ti&&out.month?S.db.plans[key(out.ti,out.month)]:null;
        if(type==='ach'&&ti&&out.month&&!pl) out.warnings.push('No plan uploaded for this month');
        if(type==='ach'&&pl) INDICATORS.forEach(i=>{const t=pl.values[i.key],a=out.values[i.key]; if(t>0&&a!=null&&a>2*t) out.warnings.push(i.short+' is over 2× plan – please check');});
        const store=type==='plan'?S.db.plans:S.db.ach; if(store[key(out.ti,out.month)]) out.warnings.push('Will replace earlier figures');
        return out;
      });
      const dup={}; rows.forEach(r=>{const k=key(r.ti,r.month);if(dup[k])r.errors.push('Duplicate row for same TI and month');dup[k]=1;});
      S.preview[type]={file:file.name,rows,missingInd};
    }catch(err){ S.preview[type]={error:err.message}; }
    $('#up-preview').innerHTML=previewHtml(type,S.preview[type]); bindPreview(type);
  };
  rd.readAsArrayBuffer(file);
}
function previewHtml(type,pv){
  if(pv.error) return `<div class="err-box">${esc(pv.error)}</div>`;
  const ok=pv.rows.filter(r=>!r.errors.length).length, bad=pv.rows.length-ok;
  return `<div class="card"><h2>Preview · ${esc(pv.file)}</h2>
    ${pv.missingInd.length?`<div class="notice">Columns not found (treated as blank): ${esc(pv.missingInd.join(', '))}</div>`:''}
    <p class="small">${ok} row(s) ready to save${bad?`, <span style="color:var(--red)">${bad} row(s) with errors will be skipped</span>`:''}.</p>
    <div class="tbl-wrap"><table><thead><tr><th>Status</th><th>Month</th><th>TI</th>${INDICATORS.map(i=>`<th class="num" title="${esc(i.label)}">${i.short}</th>`).join('')}<th>Remarks</th></tr></thead><tbody>
    ${pv.rows.map(r=>`<tr class="${r.errors.length?'bad':r.warnings.length?'warn':''}">
      <td class="small" style="white-space:normal;min-width:200px;max-width:300px">${r.errors.length?'✗ '+esc(r.errors.join('; ')):r.warnings.length?'⚠ '+esc(r.warnings.join('; ')):'✓ OK'}</td>
      <td>${esc(fmtMonth(r.month)||'?')}</td><td>${esc(r.ti)}</td>${INDICATORS.map(i=>`<td class="num">${r.values[i.key]==null?'<span class="muted">–</span>':nf(r.values[i.key])}</td>`).join('')}<td class="small">${esc(r.remarks)}</td></tr>`).join('')}
    </tbody></table></div>
    <div class="row" style="margin-top:12px"><button class="btn primary" id="up-save" ${ok?'':'disabled'}>Save ${ok} row(s)</button><button class="btn" id="up-cancel">Cancel</button></div></div>`;
}
function bindPreview(type){
  const sv=$('#up-save'), cn=$('#up-cancel');
  if(cn) cn.onclick=()=>{S.preview[type]=null;$('#up-preview').innerHTML='';const f=$('#up-file');if(f)f.value='';};
  if(sv) sv.onclick=async()=>{
    const rows=S.preview[type].rows.filter(r=>!r.errors.length).map(({ti,month,values,remarks})=>({ti,month,values,remarks}));
    sv.disabled=true; sv.textContent='Saving…';
    try{ const r=await api('upload',{type,rows}); applyData(r.data); S.preview[type]=null; render(); toast(`${rows.length} row(s) saved`); }
    catch(e){ toast(e.message); sv.disabled=false; sv.textContent='Save'; }
  };
}

/* ============================ GAP ANALYSIS ============================ */
function analyse(ti, m){
  const s=score(ti,m), open=s.open, pc=s.pace;
  const g={ti, month:m, open, pc, s, issues:[], red:[], watch:[], good:[], overall:headline(s)};
  if(!s.hasPlan) g.issues.push(`The plan for ${fmtMonth(m)} has not been uploaded.`);
  if(open){
    const sd=silentDays(ti.code), le=lastEntry(ti.code);
    if(!dayEntries(ti.code,m).length) g.issues.push(`No daily entries have been made for ${fmtMonth(m)} so far.`);
    else if(sd>=2) g.issues.push(`No daily entry for the last ${sd} working days (last entry ${fmtDate(le)}).`);
  } else if(monthState(m)==='past'){
    if(!s.hasAch) g.issues.push(`No achievement data for ${fmtMonth(m)}.`);
    else if(!s.closed) g.issues.push(`${fmtMonth(m)} has not been closed; figures below are from daily entries.`);
  }
  INDICATORS.forEach(ind=>{ const x=s.per[ind.key]; if(x.na) return; const v=metric(s,ind.key); if(v==null) return;
    const it={ind,...x,v};
    if(v<S.thresholds.amber) g.red.push(it); else if(v<S.thresholds.green) g.watch.push(it); else g.good.push(it); });
  g.pending=INDICATORS.filter(i=>isPending(s.per[i.key])&&(s.per[i.key].a||0)<s.per[i.key].t).map(i=>({ind:i,...s.per[i.key]}));
  g.red.sort((a,b)=>a.v-b.v); g.watch.sort((a,b)=>a.v-b.v);
  g.count=g.issues.length+g.red.length;
  return g;
}
function analysisSummary(g){
  const p=[]; g.issues.forEach(i=>p.push(`<span class="chip r" title="${esc(i)}">${/daily entry|daily entries/.test(i)?'Not reporting':/plan/.test(i)?'No plan':/closed/.test(i)?'Not closed':'No data'}</span>`));
  g.red.forEach(i=>p.push(`<span class="chip r">${i.ind.short} ${Math.round(i.v)}%</span>`));
  g.watch.forEach(i=>p.push(`<span class="chip a">${i.ind.short} ${Math.round(i.v)}%</span>`));
  return p.join(' ')||'<span class="chip g">On track</span>';
}
function defaultDue(){const d=new Date();d.setDate(d.getDate()+(monthState(S.month)==='open'?3:7));return d.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});}
function buildEmail(g){
  const st=S.db.settings||{}, mo=fmtMonth(g.month), due=S.emailDraft.due||defaultDue(), sender=st.sender||'TI Division, SACS', open=g.open, pc=g.pc;
  const td='style="border:1px solid #d0d7de;padding:6px 8px"', th='style="border:1px solid #d0d7de;padding:6px 8px;background:#f3f6f8;text-align:left"';
  const subject = open
    ? `[Mid-month review] ${g.ti.code} – progress against ${mo} plan (as of ${fmtDate(pc.asOf)})`
    : `[Action required] ${g.ti.code} – performance against ${mo} plan`;
  const tbl = list => open
    ? `<table style="border-collapse:collapse;font-size:13px;margin:6px 0 12px"><tr><th ${th}>Indicator</th><th ${th}>Plan</th><th ${th}>Done so far</th><th ${th}>Expected by now</th><th ${th}>% of expected</th><th ${th}>Needed per day (${pc.remaining} days left)</th><th ${th}>Current per day</th></tr>
      ${list.map(i=>`<tr><td ${td}>${esc(i.ind.label)}</td><td ${td} align="right">${nf(i.t)}</td><td ${td} align="right">${nf(i.a)}</td><td ${td} align="right">${nf1(i.exp)}</td><td ${td} align="right"><b>${Math.round(i.v)}%</b></td><td ${td} align="right">${nf1(i.need)}</td><td ${td} align="right">${nf1(i.rate)}</td></tr>`).join('')}</table>`
    : `<table style="border-collapse:collapse;font-size:13px;margin:6px 0 12px"><tr><th ${th}>Indicator</th><th ${th}>Plan</th><th ${th}>Achieved</th><th ${th}>%</th></tr>
      ${list.map(i=>`<tr><td ${td}>${esc(i.ind.label)}</td><td ${td} align="right">${nf(i.t)}</td><td ${td} align="right">${nf(i.a)}</td><td ${td} align="right"><b>${Math.round(i.v)}%</b></td></tr>`).join('')}</table>`;
  const html=`<div style="font-family:Arial,sans-serif;font-size:14px;line-height:1.5">
<p>Dear ${esc(g.ti.pm||'Project Manager')}, ${esc(g.ti.name)},</p>
<p>${open
  ?`Based on your daily entries up to <b>${fmtDate(pc.asOf)}</b> (${pc.elapsed} of ${pc.wd} working days of ${mo}), here is the SACS review of your progress against the monthly plan. Overall you are at <b>${g.overall==null?'–':Math.round(g.overall)+'%'}</b> of what should have been achieved by now.`
  :`Here is the SACS review of your performance against the ${mo} plan. Overall achievement: <b>${g.overall==null?'–':Math.round(g.overall)+'%'}</b> of plan.`}</p>
${g.issues.length?`<p style="color:#b42318"><b>Reporting:</b><br>${g.issues.map(esc).join('<br>')}</p>`:''}
${g.red.length?`<p><b>Needs urgent attention (below ${S.thresholds.amber}%${open?' of expected':''}):</b></p>${tbl(g.red)}
<p><b>Suggested actions:</b></p><ul>${g.red.map(i=>`<li><b>${esc(i.ind.label)}:</b> ${esc(TIPS[i.ind.key])}${open&&i.need!=null?` To reach the plan, about <b>${nf1(i.need)} per working day</b> is needed${i.rate!=null?` (currently ${nf1(i.rate)} per day)`:''}.`:''}</li>`).join('')}</ul>`:''}
${g.watch.length?`<p><b>Please watch (${S.thresholds.amber}–${S.thresholds.green-1}%):</b> ${g.watch.map(i=>esc(i.ind.label)+' '+Math.round(i.v)+'%').join(', ')}.</p>`:''}
${g.pending.length?`<p><b>Still to be done this month:</b> ${g.pending.map(i=>esc(i.ind.label)+' ('+nf(i.a||0)+' of '+nf(i.t)+' done)').join(', ')}.</p>`:''}
${g.good.length?`<p><b>Good progress:</b> ${g.good.map(i=>esc(i.ind.label)+' '+Math.round(i.v)+'%').join(', ')}. Well done – please keep this up.</p>`:''}
<p>${open?`Please share how you will close these gaps by <b>${esc(due)}</b> and keep daily entries up to date.`:`Please share the reasons and a corrective action plan by <b>${esc(due)}</b>, and reflect the catch-up in next month's plan.`}</p>
<p>Your dashboard: <a href="${esc(tiLink(g.ti.code))}">${esc(tiLink(g.ti.code))}</a></p>
<p>Regards,<br>${esc(sender)}<br>${esc(CONFIG.STATE_NAME)}</p></div>`;
  return {subject,html};
}
const htmlToText = h => { const d=document.createElement('div'); d.innerHTML=h.replace(/<br\s*\/?>/gi,'\n').replace(/<\/(p|tr|li|table)>/gi,'\n').replace(/<\/t[dh]>/gi,'\t'); return d.textContent.replace(/\n{3,}/g,'\n\n').trim(); };

/* ============================ SACS: GAP ANALYSIS & FEEDBACK ============================ */
function renderEmail(main){
  const st=S.db.settings||{}; const m=S.month; const open=monthState(m)==='open';
  const all=visibleTIs().map(t=>analyse(t,m)).sort((a,b)=>b.count-a.count||(a.overall??-1)-(b.overall??-1));
  const D=S.emailDraft;
  if(D.month!==m){ S.emailDraft={month:m,due:D.due,edits:{},selected:new Set(all.filter(g=>g.count>0).map(g=>g.ti.code)),current:all[0]?.ti.code}; }
  const E=S.emailDraft; if(!E.selected) E.selected=new Set(all.filter(g=>g.count>0).map(g=>g.ti.code));
  const cur=all.find(g=>g.ti.code===E.current)||all[0];
  const draft=cur?(E.edits[cur.ti.code]||buildEmail(cur)):null;
  main.innerHTML=`
  <div class="card">
    <h2>Gap analysis &amp; feedback · ${fmtMonth(m)}${open?' (live, month to date)':''}</h2>
    <p class="small muted">The tool analyses every TI ${open?'against what should have been done by today (working days)':'against the monthly plan'}, flags reporting gaps, and drafts a feedback email with the gaps, the daily rate needed to catch up, suggested actions and what is going well. Review or edit the draft, tick the TIs and press <b>Send</b>.</p>
    <div class="row">
      <label class="f">Red below (%)<input type="number" id="th-a" value="${S.thresholds.amber}" min="1" max="100" style="width:90px"></label>
      <label class="f">Green from (%)<input type="number" id="th-g" value="${S.thresholds.green}" min="1" max="150" style="width:90px"></label>
      <label class="f">CC (comma separated)<input type="text" id="em-cc" value="${esc(st.cc||'')}" placeholder="dapcu@…, ti-division@…" style="width:240px"></label>
      <label class="f">Signed as<input type="text" id="em-sender" value="${esc(st.sender||'TI Division, SACS')}" style="width:190px"></label>
      <label class="f">Reply by<input type="text" id="em-due" value="${esc(E.due||defaultDue())}" style="width:120px"></label>
      <button class="btn" id="em-apply">Apply</button>
    </div>
  </div>
  ${!cur?'<div class="card">No TIs.</div>':`
  <div class="grid two">
    <div class="card"><h2>Analysis by TI</h2>
      <div class="row" style="margin-bottom:8px"><button class="link" id="sel-all">Select all</button><button class="link" id="sel-gaps">Only TIs with gaps</button><button class="link" id="sel-none">Clear</button></div>
      <div class="tbl-wrap"><table><thead><tr><th></th><th>TI</th><th>Findings</th><th class="num">${open?'Progress':'Overall'}</th><th></th></tr></thead><tbody>
      ${all.map(g=>`<tr style="${g.ti.code===cur.ti.code?'outline:2px solid var(--accent);outline-offset:-2px':''}">
        <td><input type="checkbox" data-sel="${g.ti.code}" ${E.selected.has(g.ti.code)?'checked':''}></td>
        <td><b>${esc(g.ti.code)}</b><div class="small muted">${esc(g.ti.name)}</div>${E.edits[g.ti.code]?'<div class="small status-warn">edited</div>':''}</td>
        <td class="small" style="white-space:normal">${analysisSummary(g)}</td><td class="num">${chip(g.overall)}</td>
        <td><button class="btn" data-pv="${g.ti.code}">Review</button></td></tr>`).join('')}
      </tbody></table></div>
      <div class="row" style="margin-top:12px">
        <button class="btn primary" id="em-send">Send to ${E.selected.size} selected TI(s)</button>
        <span class="small muted">${CONFIG.API_URL?'Sent from the SACS Google account.':'Demo: emails are logged, not sent.'}</span>
      </div>
    </div>
    <div class="card"><h2>Feedback email – ${esc(cur.ti.code)}</h2>
      <div class="small"><b>To:</b> ${esc(cur.ti.email||'(no email on file)')}${st.cc?` · <b>CC:</b> ${esc(st.cc)}`:''}</div>
      <label class="f" style="margin:8px 0">Subject<input type="text" id="em-subj" value="${esc(draft.subject)}"></label>
      <div class="small muted" style="margin-bottom:6px">You can edit the text below directly before sending.</div>
      <div class="email-edit" id="em-body" contenteditable="true">${draft.html}</div>
      <div class="row" style="margin-top:10px"><button class="btn primary" id="em-one">Send to ${esc(cur.ti.code)}</button><button class="btn" id="em-reset">Reset to automatic draft</button><button class="btn" id="em-mailto">Open in my mail app</button></div>
    </div>
  </div>`}
  <div class="card"><h2>Automatic emails</h2>
    <p class="small">With the Apps Script backend, run <code>createTriggers()</code> once. It sets up (1) a reminder each working-day morning to TIs that did not enter the previous working day, and (2) on the chosen day each month, a gap email for the previous month to TIs with gaps. All emails are logged below.</p></div>
  <div class="card"><h2>Email log</h2>${(S.db.emailLog||[]).length?`<div class="tbl-wrap"><table><thead><tr><th>When</th><th>TI</th><th>To</th><th>Subject</th><th>Status</th></tr></thead><tbody>
    ${S.db.emailLog.slice(0,50).map(l=>`<tr><td>${new Date(l.at).toLocaleString('en-IN')}</td><td>${esc(l.ti)}</td><td>${esc(l.to)}</td><td>${esc(l.subject)}</td><td>${esc(l.status)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">No emails sent yet.</p>'}</div>`;
  $('#em-apply').onclick=async()=>{
    const a=+$('#th-a').value,g=+$('#th-g').value; if(!(a>0&&g>a)){toast('Green must be above red');return;}
    S.thresholds={green:g,amber:a}; S.emailDraft.due=$('#em-due').value; S.emailDraft.edits={};
    try{const r=await api('saveSettings',{settings:{cc:$('#em-cc').value.trim(),sender:$('#em-sender').value.trim(),red:a,amberMax:g}});applyData(r.data);}catch(e){toast(e.message);}
    render();
  };
  if(!cur) return;
  const saveEdit=()=>{ E.edits[cur.ti.code]={subject:$('#em-subj').value, html:$('#em-body').innerHTML}; };
  $('#em-subj').oninput=saveEdit; $('#em-body').oninput=saveEdit;
  main.querySelectorAll('[data-sel]').forEach(c=>c.onchange=()=>{c.checked?E.selected.add(c.dataset.sel):E.selected.delete(c.dataset.sel);$('#em-send').textContent=`Send to ${E.selected.size} selected TI(s)`;});
  main.querySelectorAll('[data-pv]').forEach(b=>b.onclick=()=>{E.current=b.dataset.pv;render();});
  $('#sel-all').onclick=()=>{all.forEach(g=>E.selected.add(g.ti.code));render();};
  $('#sel-gaps').onclick=()=>{E.selected=new Set(all.filter(g=>g.count>0).map(g=>g.ti.code));render();};
  $('#sel-none').onclick=()=>{E.selected.clear();render();};
  $('#em-reset').onclick=()=>{delete E.edits[cur.ti.code];render();};
  $('#em-mailto').onclick=()=>{const e=E.edits[cur.ti.code]||buildEmail(cur);location.href=`mailto:${encodeURIComponent(cur.ti.email||'')}?cc=${encodeURIComponent(st.cc||'')}&subject=${encodeURIComponent(e.subject)}&body=${encodeURIComponent(htmlToText(e.html))}`;};
  const send=async(list)=>{
    if(!list.length){toast('Select at least one TI');return;}
    const noMail=list.filter(g=>!g.ti.email); if(noMail.length){toast('No email on file for '+noMail.map(g=>g.ti.code).join(', '));return;}
    if(!confirm(`Send feedback email to ${list.length} TI(s): ${list.map(g=>g.ti.code).join(', ')}?`)) return;
    try{
      const emails=list.map(g=>{const e=E.edits[g.ti.code]||buildEmail(g);return {ti:g.ti.code,to:g.ti.email,cc:(S.db.settings||{}).cc||'',subject:e.subject,html:e.html};});
      const r=await api('sendEmails',{emails}); applyData(r.data); list.forEach(g=>delete E.edits[g.ti.code]); render(); toast(`${r.sent} email(s) ${CONFIG.API_URL?'sent':'logged (demo)'}`);
    }catch(e){toast(e.message);}
  };
  $('#em-send').onclick=()=>send(all.filter(g=>E.selected.has(g.ti.code)));
  $('#em-one').onclick=()=>send([cur]);
}

/* ============================ BOOT ============================ */
(function boot(){
  if(typeof XLSX==='undefined'||typeof Chart==='undefined'){ $('#app').innerHTML='<div class="login card err-box">Could not load required libraries. Check the internet connection and reload.</div>'; return; }
  Chart.defaults.font.family='Inter, system-ui, sans-serif';
  let sess=null; try{sess=JSON.parse(localStorage.getItem('tipm_session')||'null');}catch(e){}
  if(!sess) return renderLogin();
  api('login',{auth:sess}).then(r=>{S.session=sess;applyData(r.data);startApp();}).catch(e=>{ if(e instanceof TypeError){ renderLogin('No network. Your saved entries are kept on this device.'); } else renderLogin(); });
})();
</script>
